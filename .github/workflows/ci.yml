name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python unit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PhiServe
        run: python -m pip install -e '.[phistream-text]'
      - name: Run offline unit and simulated-upstream integration tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python -m phiserve --version
