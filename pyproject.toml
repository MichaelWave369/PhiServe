[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phiserve"
version = "0.10.0"
description = "Offline-first, local model serving"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PhiServe contributors"}]
dependencies = []

[project.optional-dependencies]
phistream-text = ["tokenizers>=0.20,<1"]

[project.scripts]
phiserve = "phiserve.cli:main"
phiserve-forge-review = "phiserve.forge_intake:main"
phiserve-benchmark = "phiserve.benchmark:main"
phiserve-advisor = "phiserve.hardware_advisor:main"

[tool.setuptools.packages.find]
where = ["src"]
